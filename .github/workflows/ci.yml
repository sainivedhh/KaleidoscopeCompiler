name: Kaleidoscope CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"
        sudo apt-get update
        sudo apt-get install -y llvm-18-dev
        echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@18
        echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmRoot = "C:\LLVM"
        if (-not (Test-Path "$llvmRoot\lib\cmake\llvm\LLVMConfig.cmake")) {
          $llvmRoot = "$env:ProgramFiles\LLVM"
        }

        if (-not (Test-Path "$llvmRoot\lib\cmake\llvm\LLVMConfig.cmake")) {
          Write-Host "LLVMConfig.cmake not found. Installing LLVM via Chocolatey..."
          choco install llvm -y --no-progress
          $llvmRoot = "C:\Program Files\LLVM"
        }

        if (-not (Test-Path "$llvmRoot\lib\cmake\llvm\LLVMConfig.cmake")) {
          # Fallback check under other standard Program Files paths
          $candidate = Get-ChildItem -Path "C:\Program Files\LLVM", "C:\LLVM", "C:\ProgramData\chocolatey\lib\llvm" -Recurse -Filter "LLVMConfig.cmake" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candidate) {
            $llvmDir = $candidate.DirectoryName
            "LLVM_DIR=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Found LLVMConfig at $llvmDir"
            exit 0
          }
          throw "LLVMConfig.cmake not found under $llvmRoot"
        }

        "LLVM_DIR=$llvmRoot\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
        "$llvmRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Configure CMake
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -eq "Windows") {
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$env:LLVM_DIR"
        } else {
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        }

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure
