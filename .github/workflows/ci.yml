name: Kaleidoscope CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"
        sudo apt-get update
        sudo apt-get install -y llvm-18-dev
        echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@18
        echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $searchRoots = @(
          "$env:ProgramFiles\LLVM",
          "C:\LLVM",
          "C:\ProgramData\chocolatey\lib\llvm"
        )

        $llvmConfig = $null
        foreach ($root in $searchRoots) {
          if (Test-Path $root) {
            $found = Get-ChildItem -Path $root -Filter "LLVMConfig.cmake" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $llvmConfig = $found.FullName
              break
            }
          }
        }

        if (-not $llvmConfig) {
          Write-Host "LLVM is present on the runner but its CMake development files are missing. Reinstalling the package..."
          choco install llvm -y --no-progress --force
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $found = Get-ChildItem -Path $root -Filter "LLVMConfig.cmake" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $llvmConfig = $found.FullName
                break
              }
            }
          }
        }

        if (-not $llvmConfig) {
          throw "LLVMConfig.cmake is still missing after reinstalling LLVM. The LLVM package must include CMake development files."
        }

        $llvmDir = Split-Path -Parent $llvmConfig
        $llvmRoot = $llvmDir
        1..3 | ForEach-Object { $llvmRoot = Split-Path -Parent $llvmRoot }
        "LLVM_DIR=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
        Write-Host "Using LLVMConfig.cmake at $llvmConfig"

    - name: Configure CMake
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -eq "Windows") {
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$env:LLVM_DIR"
        } else {
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        }

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure
