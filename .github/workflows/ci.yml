name: Kaleidoscope CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"
        sudo apt-get update
        sudo apt-get install -y llvm-18-dev
        echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@18
        echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # The standard LLVM installer does not ship LLVMConfig.cmake on Windows.
        # Download the official clang+llvm development archive, which includes the CMake package.
        $archiveUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang%2Bllvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
        $archivePath = Join-Path $env:RUNNER_TEMP "clang-llvm.tar.xz"
        $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-dev"

        New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
        Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath

        # Extract the .tar.xz archive using the tar executable available on Windows runners.
        tar -xf $archivePath -C $extractRoot
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to extract the official LLVM development archive."
        }

        $llvmConfig = Get-ChildItem -Path $extractRoot -Filter "LLVMConfig.cmake" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $llvmConfig) {
          throw "Official clang+llvm archive did not contain LLVMConfig.cmake."
        }

        $llvmDir = $llvmConfig.DirectoryName
        $llvmRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $llvmDir))
        "LLVM_DIR=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
        Write-Host "Using LLVM development package at $llvmConfig"

        # LLVM's prebuilt package references the VS 2019 DIA SDK path. Hosted runners
        # may have VS 2022 without the DIA SDK component installed, so add that component.
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\\Installer\\vswhere.exe"
        $installations = @()
        if (Test-Path $vswhere) {
          $installations = @(& $vswhere -latest -products '*' -property installationPath)
        }
        if ($installations.Count -eq 0) {
          throw "Could not locate a Visual Studio installation with vswhere."
        }

        $setup = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\\Installer\\setup.exe"
        if (Test-Path $setup) {
          foreach ($installation in $installations) {
            Write-Host "Ensuring the Visual Studio C++ diagnostic tools (DIA SDK) are installed."
            & $setup modify --installPath "$installation" --add Microsoft.VisualStudio.Component.VC.DiagnosticTools --quiet --wait --norestart
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Visual Studio component installer returned $LASTEXITCODE; checking whether diaguids.lib is available anyway."
            }
          }
        }

        $searchRoots = @(
          (Join-Path $env:ProgramFiles "Microsoft Visual Studio"),
          (Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio")
        ) | Where-Object { Test-Path $_ }

        $diaLibrary = $null
        foreach ($root in $searchRoots) {
          $diaLibrary = Get-ChildItem -Path $root -Filter "diaguids.lib" -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($diaLibrary) { break }
        }
        if (-not $diaLibrary) {
          throw "Could not locate diaguids.lib after ensuring the Visual Studio DIA SDK component is installed."
        }

        $expectedDiaDir = "C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\DIA SDK\lib\amd64"
        New-Item -ItemType Directory -Force -Path $expectedDiaDir | Out-Null
        Copy-Item -Path $diaLibrary.FullName -Destination (Join-Path $expectedDiaDir "diaguids.lib") -Force
        Write-Host "Mapped DIA SDK library from $($diaLibrary.FullName) to $expectedDiaDir"

    - name: Configure CMake
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -eq "Windows") {
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$env:LLVM_DIR"
        } else {
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        }

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure
